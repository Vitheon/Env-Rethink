[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-rethink-context"
version = "0.1.0"
description = "Expose Env-Rethink collection maps and public event logs to coding agents"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mcp==1.27.0", "pydantic>=2.10,<3", "tiktoken>=0.9,<1",
  "PyYAML>=6,<7", "jsonschema>=4.20,<5", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
env-rethink-context = "env_rethink_context.cli:main"

# Package the existing MCP implementation, rather than maintaining a fork.
# Use a separate venv from envgen-kit, which owns the same workspace_env name.
[tool.setuptools]
packages = ["env_rethink_context", "workspace_env"]
package-dir = {env_rethink_context = "integrations/env_rethink_context", workspace_env = "workspace_eval/src/workspace_env"}

[tool.setuptools.package-data]
workspace_env = ["contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["integrations/tests"]
